name: Sync Official Sources

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Check CRON_SECRET availability
        id: check_secret
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::notice::CRON_SECRET secret is not configured; skipping official source remote sync."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check_secret.outputs.enabled == 'true'
        run: npm ci

      - name: Run remote sync and ingest
        if: steps.check_secret.outputs.enabled == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SYNC_TARGET_URL: ${{ vars.SYNC_TARGET_URL }}
        run: npm run sync:remote
